<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">F01 主控台指标面板</title>
  <desc id="desc">数字孪生监控室的订单、设备、仓储和异常指标示意图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102930"/><stop offset="1" stop-color="#061217"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173b42"/><stop offset="1" stop-color="#0c2128"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#91f1cb" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="680" rx="22" fill="url(#grid)" stroke="#6caca5" stroke-opacity=".45"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <text x="58" y="72" fill="#91f1cb" font-size="20" font-weight="700" letter-spacing="3">FLEX / FACTORY CONTROL</text>
    <text x="58" y="122" fill="#effaf4" font-size="38" font-weight="800">柔性制造主控台</text>
    <text x="1142" y="72" fill="#a4c2c5" font-size="18" text-anchor="end">TERM / 01</text>
    <g transform="translate(58 170)">
      <rect width="300" height="150" rx="18" fill="url(#card)" stroke="#6caca5" stroke-opacity=".55"/>
      <text x="24" y="38" fill="#a4c2c5" font-size="17">订单数量</text>
      <text x="24" y="92" fill="#91f1cb" font-size="48" font-weight="800">2,000</text>
      <text x="216" y="92" fill="#a4c2c5" font-size="18">件</text>
      <text x="24" y="126" fill="#6caca5" font-size="16">DT-0005 / SCALE PRODUCTION</text>
    </g>
    <g transform="translate(378 170)">
      <rect width="300" height="150" rx="18" fill="url(#card)" stroke="#6caca5" stroke-opacity=".55"/>
      <text x="24" y="38" fill="#a4c2c5" font-size="17">交付结果</text>
      <text x="24" y="92" fill="#91f1cb" font-size="48" font-weight="800">95%</text>
      <text x="24" y="126" fill="#6caca5" font-size="16">1,900 合格发运 · 100 隔离清运</text>
    </g>
    <g transform="translate(698 170)">
      <rect width="300" height="150" rx="18" fill="url(#card)" stroke="#ffc88d" stroke-opacity=".75"/>
      <text x="24" y="38" fill="#a4c2c5" font-size="17">异常旁路</text>
      <text x="24" y="92" fill="#ffc88d" font-size="48" font-weight="800">8 / 12</text>
      <text x="24" y="126" fill="#6caca5" font-size="16">隔离货位 / 清运车容量</text>
    </g>
    <g transform="translate(58 366)">
      <rect width="940" height="252" rx="18" fill="#081a20" fill-opacity=".78" stroke="#6caca5" stroke-opacity=".45"/>
      <text x="24" y="40" fill="#91f1cb" font-size="18" font-weight="700" letter-spacing="2">LIVE OPERATIONS</text>
      <text x="24" y="78" fill="#effaf4" font-size="24" font-weight="700">设备与物流状态</text>
      <path d="M34 190H900" stroke="#6caca5" stroke-opacity=".35" stroke-width="2"/>
      <path d="M70 190V144M240 190V112M410 190V128M580 190V92M750 190V150" stroke="#91f1cb" stroke-width="22" stroke-linecap="round"/>
      <path d="M70 144L240 112L410 128L580 92L750 150" fill="none" stroke="#effaf4" stroke-opacity=".68" stroke-width="3"/>
      <text x="42" y="226" fill="#a4c2c5" font-size="16">双线生产</text>
      <text x="214" y="226" fill="#a4c2c5" font-size="16">包装补料</text>
      <text x="390" y="226" fill="#a4c2c5" font-size="16">扫码分拣</text>
      <text x="560" y="226" fill="#a4c2c5" font-size="16">智能立库</text>
      <text x="742" y="226" fill="#ffc88d" font-size="16">异常清运</text>
    </g>
    <g transform="translate(1034 366)">
      <rect width="108" height="252" rx="18" fill="#173b42" fill-opacity=".88" stroke="#6caca5" stroke-opacity=".45"/>
      <text x="54" y="38" fill="#a4c2c5" font-size="15" text-anchor="middle">进度</text>
      <circle cx="54" cy="123" r="43" fill="none" stroke="#38525a" stroke-width="10"/>
      <path d="M54 80A43 43 0 1 1 17 144" fill="none" stroke="#91f1cb" stroke-width="10" stroke-linecap="round"/>
      <text x="54" y="132" fill="#effaf4" font-size="24" font-weight="800" text-anchor="middle">72%</text>
      <text x="54" y="206" fill="#91f1cb" font-size="14" text-anchor="middle">运行中</text>
    </g>
    <text x="58" y="670" fill="#6caca5" font-size="17" letter-spacing="2">ORDER TELEMETRY / EVENT LOG / ENGINEERING REVIEW</text>
  </g>
</svg>
